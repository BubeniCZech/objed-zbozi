<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#020617" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Přihlášení – Objednávky zboží</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: #020617;
        color: #e2e8f0;
        font-family: "Fira Code", ui-monospace, monospace;
      }
      form {
        width: 100%;
        max-width: 22rem;
        padding: 1.5rem;
        border: 1px solid #1e293b;
        border-radius: 0.75rem;
        background: rgba(15, 23, 42, 0.7);
      }
      h1 { margin: 0 0 1.25rem; font-size: 1.25rem; color: #34d399; }
      label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #94a3b8; }
      input, button {
        width: 100%;
        padding: 0.7rem 0.9rem;
        border-radius: 0.6rem;
        font: inherit;
        font-size: 1rem;
      }
      input {
        border: 1px solid #334155;
        background: #0f172a;
        color: #f1f5f9;
      }
      input:focus { outline: 2px solid #10b981; border-color: transparent; }
      button {
        margin-top: 1rem;
        border: 0;
        background: #059669;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #10b981; }
      button:disabled { background: #334155; color: #94a3b8; cursor: default; }
      #error { min-height: 1.2rem; margin: 0.75rem 0 0; font-size: 0.85rem; color: #f87171; }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>Objednávky zboží</h1>
      <label for="password">Heslo</label>
      <input id="password" type="password" autocomplete="current-password" autofocus required />
      <button id="submit" type="submit">Přihlásit</button>
      <p id="error" role="alert"></p>
    </form>
    <script>
      const form = document.getElementById('form')
      const input = document.getElementById('password')
      const button = document.getElementById('submit')
      const error = document.getElementById('error')

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        error.textContent = ''
        button.disabled = true
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          })
          if (res.ok) {
            location.replace('/')
            return
          }
          error.textContent = res.status === 401 ? 'Špatné heslo.' : 'Přihlášení teď nefunguje, zkuste to později.'
        } catch {
          error.textContent = 'Chyba připojení, zkuste to znovu.'
        }
        button.disabled = false
        input.select()
      })
    </script>
  </body>
</html>
